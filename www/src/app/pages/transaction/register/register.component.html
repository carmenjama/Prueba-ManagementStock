<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <div class="row">
            <div class="col-md-10 col-10">
                <h4 class="card-title">{{ data.title }}</h4>
            </div>
            <div class="col-md-2 col-2">
                <div class="col-md-12 col-12 text-right">
                    <button class="btn btn-sm btn-outline-success btn-round btn-icon"
                        matTooltip="Cerrar" (click)="dialogRef.close(null)"><i class="fa fa-window-close"></i>
                    </button>
                </div>
            </div>
        </div>
      </div>
      <hr>
      <div class="card-body" style="padding: 10px 40px 10px 40px;">
        <form [formGroup]="itemForm" (ngSubmit)="setTransact()">
            <div class="row">
                <div class="col-md-12">
                <div class="form-group">
                    <label>Producto</label>
                    <select name="product" class="form-control" formControlName="productid" required>
                        <option *ngFor="let item of products" [value]="item.id">{{ item.name }}</option>
                    </select>
                </div>
                </div>
                <div class="col-md-6 px-1">
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" class="form-control" placeholder="Cantidad" formControlName="quantity" required>
                </div>
                </div>
                <div class="col-md-6 px-1">
                <div class="form-group">
                    <label>Precio</label>
                    <input type="number" class="form-control" placeholder="Precio" formControlName="price" required>
                </div>
                </div>
                <div class="col-md-12 px-1">
                <div class="form-group">
                    <label>Notas</label>
                    <textarea class="form-control" placeholder="Notas"
                    formControlName="note"
                    maxlength=500></textarea>
                </div>
                </div>
                <div class="col-md-12 px-1">
                <div class="row">
                    <div class="col-md-9">

                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-secondary btn-round col-md-12">Guardar</button>
                    </div>
                </div>
                </div>
            </div>
        </form>
      </div>
    </div>
  </div>
</div>
