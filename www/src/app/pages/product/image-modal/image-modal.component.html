<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <div class="row">
            <div class="col-md-10 col-10">
                <h4 class="card-title">{{ data.title }}</h4>
            </div>
            <div class="col-md-2 col-2">
                <div class="col-md-12 col-12 text-right">
                    <button class="btn btn-sm btn-outline-success btn-round btn-icon"
                        matTooltip="Cerrar" (click)="dialogRef.close(null)"><i class="fa fa-window-close"></i>
                    </button>
                </div>
            </div>
        </div>
      </div>
      <div class="card-body">
        <img class="border-gray" [src]="imageData">
      </div>
    </div>
  </div>
</div>
