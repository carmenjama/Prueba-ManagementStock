<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <div class="row">
            <div class="col-md-10 col-10">
                <h4 class="card-title">{{ data.title }}</h4>
            </div>
            <div class="col-md-2 col-2">
                <div class="col-md-12 col-12 text-right">
                    <button class="btn btn-sm btn-outline-success btn-round btn-icon"
                        matTooltip="Cerrar" (click)="dialogRef.close(null)"><i class="fa fa-window-close"></i>
                    </button>
                </div>
            </div>
        </div>
      </div>
      <hr>
      <div class="card-body" style="padding: 10px 40px 10px 40px;">
        <form [formGroup]="itemForm" (ngSubmit)="setProduct()">
            <div class="row">
                <div class="col-md-6">
                <div class="form-group">
                    <label>Categoría</label>
                    <select name="category" class="form-control" formControlName="categoryid" required>
                        <option *ngFor="let item of this.data.categories" [value]="item.id">{{ item.name }}</option>
                    </select>
                </div>
                </div>
                <div class="col-md-6">
                <div class="form-group">
                    <label>Código</label>
                    <input type="text" class="form-control" placeholder="Código" 
                    formControlName="code"
                    maxlength=40
                    pattern="^[A-Za-z0-9\-]+$"
                    (keypress)="onKeyPressCodigo($event)"
                    required>
                </div>
                </div>
                <div class="col-md-12 px-1">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" class="form-control" placeholder="Nombre"
                    formControlName="name"
                    maxlength=100
                    pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ0-9\- ]+$"
                    (keypress)="onKeyPressName($event)"
                    required>
                </div>
                </div>
                <div class="col-md-6 px-1">
                <div class="form-group">
                    <label>Precio</label>
                    <input type="number" class="form-control" placeholder="Precio" formControlName="price" required>
                </div>
                </div>
                <div class="col-md-6 px-1">
                <div class="form-group">
                    <label>Unidad</label>
                    <input type="text" class="form-control" placeholder="Unidad"
                    formControlName="unit"
                    maxlength=10
                    pattern="^[A-Z-a-z]+$"
                    (keypress)="onKeyPressOnlyText($event)"
                    required>
                </div>
                </div>
                <div class="col-md-12 px-1">
                <div class="form-group">
                    <label>Notas</label>
                    <textarea class="form-control" placeholder="Notas"
                    formControlName="note"
                    maxlength=500></textarea>
                </div>
                </div>
                <div class="col-md-12 px-1">
                <div class="row">
                    <div class="col-md-2 px-1" >
                        <button type="button" class="btn btn-icon btn-outline-secondary"
                            placement="top" ngbTooltip="Adjuntar archivo"
                            (click)="onFileInput()" *ngIf="imageSelect==''">
                            <i class="fa fa-paperclip"></i>
                        </button>
                    </div>
                    <div class="col-md-9 px-1" style="display: flex; align-items: center;">
                        <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/png, image/jpeg" hidden>
                        <label *ngIf="imageSelect!=''" >{{imageSelect}}</label>
                    </div>
                    <div class="col-md-1 px-1" style="display: flex; align-items: center;" *ngIf="imageSelect!=''">
                        <button class="btn btn-sm btn-outline-danger btn-round btn-icon"
                            matTooltip="Eliminar" (click)="deleteImage()"><i class="fa fa-window-close"></i>
                        </button>
                    </div>
                </div>
                </div>
                <div class="col-md-12 px-1">
                <div class="row">
                    <div class="col-md-9">

                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-secondary btn-round col-md-12">Guardar</button>
                    </div>
                </div>
                </div>
            </div>
        </form>
      </div>
    </div>
  </div>
</div>
